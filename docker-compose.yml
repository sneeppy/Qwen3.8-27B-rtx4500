env_file:
  - .env.qwen
  - .env.ui

services:
  qwen:
    image: qwen38-rtx4500-serve:latest
    build: .
    ipc: host
    env_file: .env.qwen
    volumes:
      - ${MODEL_DIR}:/app/models
      - qwen-cache:/cache
    command: "${MODE}"
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    gpus: all
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    depends_on:
      qwen:
        condition: service_healthy
    env_file: .env.ui
    ports:
      - "127.0.0.1:${WEBUI_PORT}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  qwen-cache:
  open-webui-data:
