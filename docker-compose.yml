# Qwen3.8-27B on RTX 4500 Ada.
#
#   ./check-env.sh
#   cp .env.example .env
#   docker compose up -d --build
#
# Chat: http://<host-ip>:3000  (WEBUI_BIND, default 0.0.0.0)
# API:  http://127.0.0.1:8080  (loopback only)
# Caddy is optional. To attach later:
#   docker network connect <caddy-net> qwen38-open-webui

x-qwen: &qwen
  image: qwen38-rtx4500-serve:latest
  build: .
  ipc: host
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    HOST: 0.0.0.0
    PORT: "${PORT:-8080}"
    API_KEY: "${API_KEY:-}"
    VLLM_API_KEY: "${VLLM_API_KEY:-${API_KEY:-}}"
    HF_TOKEN: "${HF_TOKEN:-}"
  volumes:
    - ${MODEL_DIR:-${MODELS_DIR:-./models}}:/app/models
    - qwen-cache:/cache

services:
  qwen:
    <<: *qwen
    container_name: qwen38-rtx4500
    command: ${MODE:-single}
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    gpus: all
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    container_name: qwen38-open-webui
    depends_on:
      qwen:
        condition: service_healthy
    environment:
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URLS: "http://qwen:8080/v1"
      OPENAI_API_KEYS: "${API_KEY:-local}"
      WEBUI_AUTH: "True"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}"
      ENABLE_SIGNUP: "${WEBUI_ENABLE_SIGNUP:-True}"
      WEBUI_NAME: "${WEBUI_NAME:-Qwen3.8-27B}"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
    ports:
      - "${WEBUI_BIND:-0.0.0.0}:${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  qwen-cache:
  open-webui-data:
